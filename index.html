<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signet Apparel Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=Anton&family=Archivo+Black&family=Bebas+Neue&family=Oswald:wght@500&family=Pacifico&family=Lobster&family=Permanent+Marker&family=Alfa+Slab+One&family=Montserrat:wght@600;700&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="app">
  <div class="bar">
    <button id="uploadBtn" class="big-btn primary">📤 Upload Logo</button>
    <button id="textBtn" class="big-btn">🔤 Add Text</button>
    <input type="file" id="uploadInput" accept="image/*" hidden>
  </div>

  <div class="text-row hidden" id="textRow">
    <input id="textInput" type="text" placeholder="Type your text..." value="YOUR TEXT">
    <select id="fontSelect"></select>
    <div class="swatch-row" id="textColors"></div>
    <button id="addTextBtn" class="big-btn primary small">Add</button>
  </div>

  <div class="stage-area" id="stageArea">
    <div class="canvas-wrap" id="stageWrap">
      <div id="shirtSvg"></div>
      <canvas id="c"></canvas>
      <div id="printArea"></div>
    </div>
    <div id="stage3d" class="hidden">
      <div id="stage3dLoading" class="stage3d-loading">Loading 3D…</div>
    </div>
    <div class="obj-toolbar hidden" id="objToolbar">
      <button data-act="center" title="Center">↔</button>
      <button data-act="flip" title="Flip">⇋</button>
      <button data-act="dup" title="Duplicate">⧉</button>
      <button data-act="del" class="danger" title="Delete">✕</button>
    </div>
  </div>

  <div class="bar">
    <div class="pills" id="locToggle">
      <button class="pill active" data-loc="ff">Front <span class="dot hidden" id="dot-ff"></span></button>
      <button class="pill" data-loc="lc">Chest <span class="dot hidden" id="dot-lc"></span></button>
      <button class="pill" data-loc="fb">Back <span class="dot hidden" id="dot-fb"></span></button>
    </div>
    <div class="pills view-toggle">
      <button class="pill active" data-view="2d">Edit</button>
      <button class="pill" data-view="3d">3D</button>
    </div>
  </div>

  <div class="bar">
    <div class="pills" id="decoToggle">
      <button class="pill active" data-deco="print">Screen Print</button>
      <button class="pill" data-deco="embroidery">Embroidery</button>
    </div>
    <button id="heatherBtn" class="chip" title="Heather fabric texture">Heather</button>
  </div>

  <div class="bar picker-bar">
    <div class="prods" id="productGrid"></div>
    <div class="colors" id="colorGrid"></div>
  </div>

  <div class="bar">
    <button id="downloadBtn" class="big-btn">Download Mockup</button>
    <button id="quoteBtn" class="big-btn primary">Get a Quote</button>
  </div>
</main>

<div class="toast hidden" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="threed.js"></script>
<script src="app.js"></script>
</body>
</html>
